trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '6.x'

- task: DotNetCoreCLI@2
  displayName: tests
  inputs:
    command: test
    projects: '**/*Payslip*[Tt]ests/*.csproj'
    publishTestResults: true
    arguments: '--configuration $(buildConfiguration)'

- script: |
    sudo apt-get update
    sudo apt-get install -y docker.io
    sudo apt-get install -y docker-compose
    docker --version
    docker compose version
  displayName: Install Docker and Docker Compose

- script: |
    docker compose -f docker-compose.yml config --project-name payslip-api
  displayName: Debug Docker Compose Project Name

- task: DockerCompose@1
  displayName: Build services
  inputs:
    containerregistrytype: 'Container Registry'
    dockerRegistryEndpoint: 'Vitor Nikiforck Docker Hub'
    dockerComposeFile: 'docker-compose.yml'
    action: 'Build services'
    arguments: '--project-name payslip-api'
    includeSourceTags: true
    includeLatestTag: true

- task: DockerCompose@1
  displayName: Push services
  inputs:
    containerregistrytype: 'Container Registry'
    dockerRegistryEndpoint: 'Vitor Nikiforck Docker Hub'
    dockerComposeFile: 'docker-compose.yml'
    action: 'Push services'
    arguments: '--project-name payslip-api'
    includeSourceTags: true
    includeLatestTag: true

- script: |
    env
  displayName: Check Environment Variables
